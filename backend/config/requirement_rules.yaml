# How a tender line is classified, beyond its section category (section_categories.yaml).
# Phrases match whole words on normalize_for_search() text; `make_patterns` are regular
# expressions on the printed text. Add new wording here, never in Python.

# Section category kind -> requirement type (CLAUDE.md section 6).
kind_types:
  technical: technical
  commercial: commercial
  eligibility: compliance_doc
  legal: legal
  administrative: compliance_doc

# A line whose category cannot be told. It is reported as unsupported + needs_review, like a
# vague line: never as a pass or a failure.
unclassified_type: vague

# Lines of an item's schedule row that name no category are technical (they describe the item).
item_default_category: technical_specifications

# D3: wording with nothing to verify. A line that also holds a code or names a make is not vague.
vague: [good quality, best quality, high quality, superior quality, reputed make, standard make,
        as per standard, as per standards, as per relevant standard, as per applicable standard,
        as per requirement, as required, suitable type, first class]

# Whether the tender requires the line. Mandatory wins if both match; neither means unknown.
mandatory: [shall, must, mandatory, compulsory, is required, are required, liable to be rejected,
            pre requisite, prerequisite]
optional: [may, optional, if required, preferably, preferred, advised, advisable]

# D4: another make or grade is acceptable. Recorded on the requirement; it never fails a make.
or_equivalent: [or equivalent, or equivelent, or equal, or similar, or eqv]

# T9 and D4: a make named by the tender. The group `make` is what gets recorded.
make_patterns:
  - '\bmake\s*:\s*(?:m/s\.?\s*)?(?P<make>[^.,;)\n]+)'
  - '\bmake\s+like\s+(?P<make>[^.,;)\n]+?)(?:\s+make)?\s*(?:[.,;)\n]|$)'
  - '\bsingle\s+tender\s+enquiry\s+on\s+(?:m/s\.?\s*)?(?P<make>[^.,;\n]+)'

# The tender says only one firm is acceptable: shown as a warning above the results. GeM prints
# "Single Bid / Proprietary Article Certificate" on every bid, so these must stay this narrow.
single_firm_patterns:
  - '\bsingle\s+tender\s+enquiry\b'
  - '\bonly\s+this\s+firm\b'
  - '\bsingle\s+tender\s+applicable\s*:\s*yes\b'
  - '\bproprietary\s+tender\b'

# GeM's bracketed notes inside a specification name, cut before the line is classified (the
# printed text is kept). "Face to Face Dimension (In this context, the final decision made by
# the consignee/ Buyer shall be binding)" is a size, not a delivery line (8188046).
note_pattern: '\(\s*(?:in\s+this\s+context|hint)\b[^)]*\)'

# An acceptable-make list: the line naming it, each entry, and what ends the list. Roman
# markers (i, v, x) number the entries; any other letter ("b)") is the next clause.
make_list_pattern: 'following\s+makes?\b[^:]*:\s*(?P<list>.*)'
make_list_item_pattern: '(?:^|(?<=\s))[ivx]+\)\s*(?:m/s\.?\s*)?(?P<make>.+?)(?=\s+[ivx]+\)|\s*$)'
make_list_end_pattern: '\s[a-hj-uwyz]\)\s'

# T1: where one item's text starts in a specification file ("Item 4 - CS0108 - Cast Steel ...").
item_start_pattern: '(?:^|(?<=\s))item\s+(?P<no>\d{1,3})\s*[-–]\s*(?:[A-Z]{2}\d{5,}\s*[-–]\s*)?'
# A row opening a block shared by several items ("For Item Sl. No.: 1, 2 & 3"), the whole line.
item_group_pattern: 'for\s+item\s+(?:sl\.?\s*)?no\.?\s*[:.\-]*\s*(?P<nos>\d+(?:\s*[,&]\s*\d+)*)\s*\.?'
# Inside a block, a part of a value naming its items ("For Item Sl. No-4, 5 & 6").
item_qualifier_pattern: '(?:only\s+)?for\s+item\s+(?:sl\.?\s*)?no\.?\s*[:.\-]*\s*(?P<nos>\d+(?:\s*[,&]\s*\d+)*)\s*:?'
# Where one such clause ends and the next begins ("... # 300 & For Item ...", "LCB ... /LF2 only for Item ...").
item_clause_split_pattern: '\s*[&/]\s*(?=for\s+item|[^&/\s]+(?:\s+[^&/\s]+){0,4}\s+(?:only\s+)?for\s+item)'
# The specification has ended: a new annexure, or a delivery section.
segment_end_pattern: '^\s*(?:annexure\b|(?:[ivx]+\.\s*)?delivery\s+period\b)'
# Form text cut from a line, with everything after it on that line.
segment_cut_pattern: '\bnull\b|agreed for the above|name of authori[sz]ed signatory|fact or no\b|factor description|vendor response'

# Annexures whose blocks are headed by the item's name, not its number (8157758 Annexure A:
# "SS ball valve set - 1 set shall consists of the following ..."; scans lose the Sl. No).
# The item's name is its title without this ending ("SS ball valve set as per Annexure A").
item_title_suffix_pattern: '\s+(?:set\s+)?(?:as\s+per|according\s+to|refer)\s+annexure\b.*$|\s+set$'
# A block heading: the name, then "set" or a dash/colon (not the name inside a sentence).
name_heading_follow_pattern: '^\s*(?:sets?\b|[-:])'
# Scanned lines may start with a stray Sl. No or OCR noise before the name ("11 SS ball valve set").
name_heading_max_lead_words: 2
# One line of a set: what it holds and how many ("1" - 10 nos"); the count is not a requirement.
set_line_pattern: '^(?P<value>.+?)\s*[-:]\s*(?P<count>\d+)\s*(?:nos?|no\.|pcs|pieces|numbers)\b\.?\s*$'
# A set line holding a pipe size: inches, mm, DN or NB.
set_size_pattern: '^(?:\d+(?:[\s-]+\d+/\d+)?|\d+/\d+)\s*(?:"|\x27\x27|inch(?:es)?\b|mm\b)|^(?:dn|nb)\s*\d+|^\d+\s*nb\b'
# A scan that lost a size: OCR reads 1/2" or 3/4" as "%", or keeps no digit (never guessed, sent to review).
set_unreadable_pattern: '%|^[^0-9]*$'
# Letters OCR confuses, read alike only when matching an item name to a heading (CLAUDE.md A7: "Gl" is "GI").
name_ocr_confusions: {l: i, '|': i}
set_size_label: Size
set_item_label: Set contents

# Words ending in "." that do not end a sentence when prose is split into requirements.
sentence_abbreviations: [m/s, "no", nos, gr, ltd, pvt, dt, sl, sr, rs, inr, govt, dept, viz, etc, e.g, i.e, f.o.r]
