# GeM Marketplace, read when a tender item's product type has no manufacturer document
# (DISCOVERY_ENABLED=true). A check first searches GeM with the items' own words
# (https://mkp.gem.gov.in/search?q=..., whose category list is plain HTML; checked 2026-11-19) and
# keeps the categories whose names name the type. The categories below are read only when that
# search finds none. Category pages list their products in plain HTML (checked 2026-11-18).
#
#   product_type   an ontology product type (ontology/*.yaml)
#   categories     fallback slugs of https://mkp.gem.gov.in/<slug>/search, read in this order
#   exclude        look-alike products sold in those categories that are not this type; a listing
#                  whose title or model names one (and not the type outside it) is rejected.
#                  Kept here, not in the ontology: on a tender a "flow control valve" can be a
#                  real control valve, on GeM it is a pneumatic fitting (Festo GRLA, 2026-11-18).
#
# A listing is kept only if its title or its specification rows name the product type (ontology
# synonyms) and it has at least GEM_MIN_SPEC_ROWS rows. GeM specifications are typed in by the
# seller: they are never treated like a manufacturer's datasheet.

product_types:
  - product_type: thermocouple
    categories:
      - measuring-and-observing-and-testing-instruments-temperature-and-heat-measuring-instruments-mineral-insulated-thermocouple
  - product_type: control_valve
    categories:
      - valves-control-valve-pneumatic
    exclude: [flow control valve, directional control valve, throttle valve, pneumatic fitting,
              push in fitting]

# Item title words that never tell products apart when ranking a category's listings (the
# product type's own words are skipped anyway).
rank_ignore_words: [with, and, for, the, of, type, make, nos, "no", as, per, "or", to, in]

# Values that state nothing; a row holding only one of these is not stored.
# How a product is sold on GeM (the "sold_as" classes of a product card), best first: the maker
# itself, then a reseller the maker authorised, then any reseller. Ranks listings to open after
# product fit; a card naming none of these goes last.
seller_rank: [oem, authorized, resellers]

empty_values: [NA, N/A, "-", Not Applicable, Not Available, None]

# When no GeM category from the search names an item exactly, every category the search offered
# is scored by the words it shares with the item title (GEM_FIT_MIN_COVERAGE / _PRECISION). Both
# sides are written the same way first: each abbreviation becomes its full words (the ontology
# `abbreviations` are used too). Generic, for any tender category; one word per key.
word_equivalents:
  hex: hexagonal
  hexagon: hexagonal
  ss: stainless steel
  ms: mild steel
  gi: galvanized iron
  galvanised: galvanized
  cs: carbon steel
  ci: cast iron
  pvc: polyvinyl chloride
  upvc: unplasticized polyvinyl chloride
  cpvc: chlorinated polyvinyl chloride
  hdpe: high density polyethylene
  assy: assembly
  nrv: non return valve
  sds: sds
  elec: electrical
  elect: electrical

# A GeM category name is cut into parts at brackets, " - ", commas, "&", "/", ":" and before
# these words; a part is compared with the item ("Hexagonal Head Bolts (V2) ISI marked to IS 1363"
# -> "Hexagonal Head Bolts"). Item titles are cut the same way ("SS hex head bolt set as per ...").
category_cut_words: [as per, conforming, confirming, according, compliant, isi, marked, for, with,
                     including, to, as, per, under]

# Words left out on both sides when a listing's category slug is compared with a buyer category's
# page ("phpa-water-shut-off..." is the category "PHPA for Water Shut off ..."), and when shared
# words are counted.
category_filler_words: [for, of, and, the, to, in, "on", with, a, an, set, sets, nos, "no", type,
                        item, items, annexure, supply, make, model, size, other]
