[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-matcher"
version = "0.1.0"
description = "Match GeM tender requirements against manufacturer catalogues with verifiable evidence."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pymupdf>=1.25",
    "pyyaml>=6.0",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "pint>=0.24",            # unit conversion to ontology canonical units (kg/cm2 -> bar)
    "snowballstemmer>=2.2",  # pure-Python stemmer for search_text ("valves" -> "valv")
    "httpx>=0.27",           # download documents linked from tender bid.pdf
    "python-multipart>=0.0.20",  # FastAPI needs it to read file uploads (POST /tenders)
    "openpyxl>=3.1",         # read ATC/BOQ spreadsheets (.xlsx) linked from tenders
    "pgvector>=0.3",         # SQLAlchemy type + cosine distance for the vector column
    # Local embeddings (bge-m3). For the GPU, install PyTorch first from the CUDA index:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu130
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",      # Okapi BM25 over the product-filtered chunks' search_text
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "types-openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "D", "ANN", "S", "PT"]
ignore = [
    "D104", # empty package __init__.py files need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]
"alembic/versions/**" = ["D415"]  # first line is the migration message

# ---------------------------------------------------------------- black
[tool.black]
line-length = 100
target-version = ["py314"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
# PyMuPDF declares py.typed but leaves many functions unannotated.
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
# pytesseract, snowballstemmer and rank_bm25 ship no type hints.
module = ["pytesseract", "pytesseract.*", "snowballstemmer", "snowballstemmer.*", "rank_bm25"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Third-party: Starlette's TestClient warns about its own httpx dependency; not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
