  kgf/cm²: kgf/cm**2
  ksc: kgf/cm**2
  °c: degC
  deg c: degC
  degc: degC
  c: degC
  °f: degF
  degf: degF
  m3/h: m**3/h
  m3/hr: m**3/h
  m³/h: m**3/h
  m³/hr: m**3/h
  cum/hr: m**3/h
