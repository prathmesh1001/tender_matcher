# Ontology for industrial valves and pumps (GeM tenders vs manufacturer catalogues).
#
# All category knowledge lives here, never in Python (CLAUDE.md section 5):
#   product_types  what is being bought; sub-types are distinct (B2: triple-offset != concentric)
#   attributes     canonical attribute names, their unit dimension and the words tenders use
#   codes          canonical forms for material/rating/size codes (A4); applied in this order on
#                  lower-cased, unicode-folded text, so longer codes come before their prefixes
#   abbreviations  expanded on the query side (A5)
#   equivalents    names and grade codes meaning the same material; a query naming one also
#                  searches for the others (catalogues often give only "ASTM A126 Gr B")
#   units          spellings seen in tenders/catalogues -> pint unit expression (B5)
#   nps_to_dn      ASME B36.10 nominal pipe size (inch) -> DN (mm)
#   class_to_pn    EN 1759-1 Class designation -> PN designation (B6); never derive via bar values

category: valves_pumps
version: 1

product_types:
  # Synonyms are phrases matched on normalized text (so plurals and spelling variants match).
  # A single word is only listed when it cannot mean anything else in a valve/pump document
  # ("butterfly" yes, "ball" no: ball bearing, float ball; B1). Vendor series/brand names
  # (e.g. "AquaSeal") are not here: each catalogue declares its product types in sources.yaml.
  - name: ball_valve
    synonyms: [ball valve]
    sub_types:
      - name: floating_ball
        synonyms: [floating ball]
      - name: trunnion_mounted
        synonyms: [trunnion mounted, trunnion]
  - name: butterfly_valve
    synonyms: [butterfly valve, butterfly, bfv, hpbfv, tobv]
    sub_types:
      - name: concentric
        synonyms: [concentric, centric, zero offset, resilient seated, rubber lined]
      - name: double_offset
        synonyms: [double offset, double eccentric, high performance butterfly, hpbfv]
      - name: triple_offset
        synonyms: [triple offset, triple eccentric, tobv]
  - name: gate_valve
    synonyms: [gate valve, sluice valve]
    sub_types:
      - name: wedge_gate
        synonyms: [wedge gate, flexible wedge, solid wedge]
      - name: parallel_slide
        synonyms: [parallel slide]
      - name: knife_gate
        synonyms: [knife gate, knife edge gate]
  - name: globe_valve
    synonyms: [globe valve]
    sub_types: []
  - name: check_valve
    synonyms: [check valve, non return valve, nrv, reflux valve, dual plate, swing check]
    sub_types:
      - name: swing_check
        synonyms: [swing check, swing type]
      - name: lift_check
        synonyms: [lift check]
      - name: dual_plate_check
        synonyms: [dual plate, double door, wafer check]
      - name: piston_check
        synonyms: [piston check]
  - name: plug_valve
    synonyms: [plug valve]
    sub_types:
      - name: lubricated_plug
        synonyms: [lubricated plug]
      - name: sleeved_plug
        synonyms: [sleeved plug]
  - name: centrifugal_pump
    synonyms: [centrifugal pump, monoblock pump, end suction pump, split case pump]
    sub_types:
      - name: end_suction
        synonyms: [end suction]
      - name: split_case
        synonyms: [split case, horizontal split]
      - name: monoblock
        synonyms: [monoblock]
      - name: multistage
        synonyms: [multistage, multi stage]
  - name: submersible_pump
    synonyms: [submersible pump, borewell pump]
    sub_types: []

attributes:
  - name: nominal_size
    dimension: length
    canonical_unit: mm
    synonyms: [size, nominal size, nominal bore, nominal diameter, nb, dn, nps, valve size]
  - name: pressure_rating
    dimension: pressure
    canonical_unit: bar
    synonyms: [pressure rating, working pressure, design pressure, max pressure, rated pressure, pn]
  - name: pressure_class
    dimension: none
    synonyms: [class, pressure class, rating, asme class, ansi class]
  - name: test_pressure
    dimension: pressure
    canonical_unit: bar
    synonyms: [test pressure, hydro test pressure, shell test, seat test]
  - name: max_temperature
    dimension: temperature
    canonical_unit: degC
    synonyms: [max temperature, maximum temperature, design temperature, operating temperature]
  - name: min_temperature
    dimension: temperature
    canonical_unit: degC
    synonyms: [min temperature, minimum temperature]
  - name: flow_rate
    dimension: flow
    canonical_unit: m**3/h
    synonyms: [flow, flow rate, capacity, discharge]
  - name: head
    dimension: length
    canonical_unit: m
    synonyms: [head, total head, delivery head, total dynamic head]
  - name: power
    dimension: power
    canonical_unit: kW
    synonyms: [power, motor power, motor rating, rated power, kw rating]
  - name: speed
    dimension: speed
    canonical_unit: rpm
    synonyms: [speed, rpm, rotational speed]
  - name: body_material
    dimension: none
    synonyms: [body, body material, body moc, moc of body, shell material]
  - name: disc_material
    dimension: none
    synonyms: [disc, disc material, disk, wedge, ball material, closure member]
  - name: seat_material
    dimension: none
    synonyms: [seat, seat material, seat ring, seal ring]
  - name: stem_material
    dimension: none
    synonyms: [stem, stem material, shaft, shaft material, spindle]
  - name: trim_material
    dimension: none
    synonyms: [trim, trim material]
  - name: packing_material
    dimension: none
    synonyms: [packing, gland packing, stem seal]
  - name: end_connection
    dimension: none
    synonyms: [end connection, ends, end type, connection]
    values: [flanged, butt_weld, socket_weld, threaded, wafer, lug]
  - name: operation
    dimension: none
    synonyms: [operation, operator, actuation, operated]
    values: [lever, gear, handwheel, electric_actuator, pneumatic_actuator]
  - name: design_standard
    dimension: none
    synonyms: [design standard, design code, manufacturing standard, design]
  - name: test_standard
    dimension: none
    synonyms: [testing standard, test standard, inspection and testing]
  - name: face_to_face_standard
    dimension: none
    synonyms: [face to face, face-to-face, f to f]

codes:
  # Stainless grades: "SS 316L", "SS-316", "316 SS", "AISI 316"
  - pattern: '\b(?:ss|aisi)\s*-?\s*316\s*l\b|\b316\s*l\s*ss\b'
    canonical: ss316l
  - pattern: '\b(?:ss|aisi)\s*-?\s*316\b|\b316\s*ss\b'
    canonical: ss316
  - pattern: '\b(?:ss|aisi)\s*-?\s*304\s*l\b|\b304\s*l\s*ss\b'
    canonical: ss304l
  - pattern: '\b(?:ss|aisi)\s*-?\s*304\b|\b304\s*ss\b'
    canonical: ss304
  - pattern: '\b(?:ss|aisi)\s*-?\s*410\b|\b410\s*ss\b'
    canonical: ss410
  - pattern: '\b17\s*-?\s*4\s*-?\s*ph\b'
    canonical: 17_4ph
  # ASTM castings and forgings: "ASTM A 216 Gr. WCB", "A216 WCB", "WCB"
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*216\s*(?:gr(?:ade)?\.?\s*)?)?wcb\b'
    canonical: a216_wcb
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*216\s*(?:gr(?:ade)?\.?\s*)?)?wcc\b'
    canonical: a216_wcc
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*217\s*(?:gr(?:ade)?\.?\s*)?)?wc\s*-?\s*6\b'
    canonical: a217_wc6
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*217\s*(?:gr(?:ade)?\.?\s*)?)?wc\s*-?\s*9\b'
    canonical: a217_wc9
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*352\s*(?:gr(?:ade)?\.?\s*)?)?lcb\b'
    canonical: a352_lcb
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*351\s*(?:gr(?:ade)?\.?\s*)?)?cf\s*-?\s*8\s*m\b'
    canonical: a351_cf8m
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*351\s*(?:gr(?:ade)?\.?\s*)?)?cf\s*-?\s*8\b'
    canonical: a351_cf8
  - pattern: '\b(?:astm\s*)?a\s*-?\s*105\s*n?\b'
    canonical: a105
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*350\s*(?:gr(?:ade)?\.?\s*)?)?lf\s*-?\s*2\b'
    canonical: a350_lf2
  # Ratings and sizes: "PN 16", "Class 150", "150#", "150 lbs", "DN 80", "80 NB"
  - pattern: '\bpn\s*-?\s*(\d+)\b'
    canonical: 'pn\1'
  - pattern: '\b(?:class|cl\.?)\s*-?\s*(\d{3,4})\b'
    canonical: 'class\1'
  - pattern: '\b(\d{3,4})\s*(?:#|lbs?\b)'
    canonical: 'class\1'
  - pattern: '\bdn\s*-?\s*(\d+)\b'
    canonical: 'dn\1'
  - pattern: '\bnb\s*-?\s*(\d+)\b|\b(\d+)\s*nb\b'
    canonical: 'dn\1\2'
  # Standards: "API 600", "API-6D", "BS 5351", "IS 14846"
  - pattern: '\bapi\s*-?\s*(\d+[a-z]?)\b'
    canonical: 'api\1'
  # "BS EN 593" is EN 593 adopted by BSI: same standard as "EN 593" / "EN593" (before the BS rule)
  - pattern: '\b(?:bs\s*-?\s*)?en\s*-?\s*(\d{3,5})\b'
    canonical: 'en\1'
  - pattern: '\bbs\s*-?\s*(\d{3,5})\b'
    canonical: 'bs\1'
  - pattern: '\bis\s*[:-]?\s*(\d{3,5})\b'
    canonical: 'is\1'
  - pattern: '\basme\s*-?\s*b\s*-?\s*(\d+)\.(\d+)\b'
    canonical: 'asme_b\1_\2'

abbreviations:
  nrv: check valve
  bfv: butterfly valve
  tobv: triple offset butterfly valve
  ci: cast iron
  sg iron: ductile iron
  di: ductile iron
  cs: carbon steel
  ms: mild steel
  moc: material of construction
  nb: nominal size
  dn: nominal size
  nps: nominal size
  ff: flat face
  rf: raised face
  rtj: ring type joint
  bw: butt weld
  sw: socket weld
  ptfe: polytetrafluoroethylene
  rptfe: reinforced ptfe

equivalents:
  # Grade codes are written joined ("IS210"): a bare number would match any "210 mm".
  # Only grades that are unambiguously this material family belong here.
  - name: cast_iron
    terms: [cast iron, grey cast iron, gray cast iron, grey iron, ci, A126, A48, IS210, EN1561,
            GG25, FG260]
  - name: ductile_iron
    terms: [ductile iron, sg iron, sgi, spheroidal graphite iron, di, A536, A395, IS1865,
            EN1563, GGG40, GGG50]

