# Ontology for industrial valves and pumps (GeM tenders vs manufacturer catalogues).
#
# All category knowledge lives here, never in Python (CLAUDE.md section 5):
#   product_types  what is being bought; sub-types are distinct (B2: triple-offset != concentric)
#   attributes     canonical attribute names, their unit dimension and the words tenders use;
#                  `critical` = identifies the product, so it decides which catalogue is chosen;
#                  `limit: max` = a catalogue value is a rating the product reaches (16 bar
#                  meets a 10 bar requirement); `nominal_pipe_size` = inch sizes go via nps_to_dn
#   material_names words that start a material value, so "Pump Shaft Carbon Steel" reads as
#                  label + value
#   physical_min   lowest value that can exist, in the canonical unit: below it a value was misread
#   codes          canonical forms for material/rating/size codes (A4); applied in this order on
#                  lower-cased, unicode-folded text, so longer codes come before their prefixes
#   abbreviations  expanded on the query side (A5)
#   equivalents    names and grade codes meaning the same material; a query naming one also
#                  searches for the others (catalogues often give only "ASTM A126 Gr B")
#   units          spellings seen in tenders/catalogues -> pint unit expression (B5)
#   prefix_units   units written before the number ("DN 50" = 50 mm)
#   nps_to_dn      ASME B36.10 nominal pipe size (inch) -> DN (mm)
#   class_to_pn    EN 1759-1 Class designation -> PN designation (B6); never derive via bar values

category: valves_pumps
version: 1

product_types:
  # Synonyms are phrases matched on normalized text (so plurals and spelling variants match).
  # A single word is only listed when it cannot mean anything else in a valve/pump document
  # ("butterfly" yes, "ball" no: ball bearing, float ball; B1). Vendor series/brand names
  # (e.g. "AquaSeal") are not here: each catalogue declares its product types in sources.yaml.
  - name: ball_valve
    synonyms: [ball valve]
    sub_types:
      - name: floating_ball
        synonyms: [floating ball]
      - name: trunnion_mounted
        synonyms: [trunnion mounted, trunnion]
  - name: butterfly_valve
    synonyms: [butterfly valve, butterfly, bfv, hpbfv, tobv]
    sub_types:
      - name: concentric
        synonyms: [concentric, centric, zero offset, resilient seated, rubber lined]
      - name: double_offset
        synonyms: [double offset, double eccentric, high performance butterfly, hpbfv]
      - name: triple_offset
        synonyms: [triple offset, triple eccentric, tobv]
  - name: gate_valve
    synonyms: [gate valve, sluice valve]
    sub_types:
      - name: wedge_gate
        synonyms: [wedge gate, flexible wedge, solid wedge]
      - name: parallel_slide
        synonyms: [parallel slide]
      - name: knife_gate
        synonyms: [knife gate, knife edge gate]
  - name: globe_valve
    synonyms: [globe valve]
    sub_types: []
  - name: check_valve
    synonyms: [check valve, non return valve, nrv, reflux valve, dual plate, swing check]
    sub_types:
      - name: swing_check
        synonyms: [swing check, swing type]
      - name: lift_check
        synonyms: [lift check]
      - name: dual_plate_check
        synonyms: [dual plate, double door, wafer check]
      - name: piston_check
        synonyms: [piston check]
  - name: plug_valve
    synonyms: [plug valve]
    sub_types:
      - name: lubricated_plug
        synonyms: [lubricated plug]
      - name: sleeved_plug
        synonyms: [sleeved plug]
  - name: centrifugal_pump
    synonyms: [centrifugal pump, monoblock pump, end suction pump, split case pump,
               centrifugal pumpset, monoblock pumpset]
    sub_types:
      - name: end_suction
        synonyms: [end suction]
      - name: split_case
        synonyms: [split case, horizontal split]
      - name: monoblock
        synonyms: [monoblock]
      - name: multistage
        synonyms: [multistage, multi stage]
  - name: submersible_pump
    synonyms: [submersible pump, borewell pump, submersible pumpset]
    sub_types: []
  # No manufacturer catalogue covers it yet; with DISCOVERY_ENABLED its evidence can come from
  # GeM Marketplace listings (seller-declared, always reviewed). "Globe type control valve" is a
  # control valve: the exact phrase wins over globe_valve's words.
  - name: control_valve
    synonyms: [control valve, control valves]
    sub_types:
      - name: pneumatic
        synonyms: [pneumatic, pneumatically operated, air operated]

# Words a label may have after a synonym and still name that attribute ("Body Materials", "Size
# Range", "Ends Parameter"). Any other word means the label names something else ("Stem Length").
# Products of this category with no product type above (no catalogues are registered for them).
# A title naming one as a phrase is that product, never a type sharing its words in another
# order: "PVC foot valve Ball type" is a foot valve, not a ball valve (8157758 item 21).
other_products: [foot valve, strainer, y strainer, pressure reducing valve, safety valve,
  relief valve, needle valve, solenoid valve, air release valve, float valve]

# "X with Y" / "X for Y": the product is X ("Ball Valve with Gear Operator", "Centrifugal
# Pump for Water Service"); "Cable for Submersible Pumps" is a cable. Used for tender titles
# naming several types and for GeM category names and listing titles.
accessory_words: [with, along with, including, complete with, for]

# After a product name, these make the name a part, tool or service for it, not the product
# ("Valve Repair Kit", "Pump Spare Parts", "Valve Grinding Machine"). Not "part" alone
# ("3 Part Body Ball Valve") and not "actuator"/"operator" (they stem like "actuated").
part_words: [spare, spares, spare parts, repair, kit, tool, tools, spanner, machine, tester, nipple,
  test bench, test rig, calibrator, calibration, furnace, trainer, cut section, starter,
  starters, cable, cables, panel, control panel]

label_generic_words: [valve, moc, material, parameter, component, part, sl, "no", number, type,
                      spec, specification, description, detail, range, dim, dimension, scope,
                      iso, asme, of, to, and, for, at, the, max, maximum, min, minimum,
                      iss]

# Stemming folds these into a synonym's stem ("designation" -> "design"), but a material
# "Designation" column is never a design standard.
label_distinct_words: [designation, designations, designated]

attributes:
  - name: nominal_size
    critical: true
    dimension: length
    canonical_unit: mm
    synonyms: [size, nominal size, nominal bore, nominal diameter, nb, dn, nps, valve size]
    nominal_pipe_size: true
  - name: pressure_rating
    critical: true
    dimension: pressure
    canonical_unit: bar
    synonyms: [pressure rating, working pressure, design pressure, max pressure, rated pressure, pn]
    limit: max
  - name: pressure_class
    critical: true
    dimension: none
    synonyms: [class, pressure class, rating, asme class, ansi class, nominal pressure, pn]
  - name: test_pressure
    dimension: pressure
    canonical_unit: bar
    synonyms: [test pressure, hydro test pressure, shell test, seat test]
  - name: max_temperature
    dimension: temperature
    canonical_unit: degC
    synonyms: [temperature, max temperature, maximum temperature, design temperature,
               design temp, temp design, operating temperature]
    limit: max
    physical_min: -273.15
  - name: min_temperature
    dimension: temperature
    canonical_unit: degC
    synonyms: [min temperature, minimum temperature]
    limit: min
    physical_min: -273.15
  - name: flow_rate
    dimension: flow
    canonical_unit: m**3/h
    synonyms: [flow, flow rate, capacity, discharge]
    limit: max
  - name: head
    dimension: length
    canonical_unit: m
    synonyms: [head, total head, delivery head, total dynamic head]
    limit: max
  - name: power
    dimension: power
    canonical_unit: kW
    synonyms: [power, motor power, motor rating, rated power, kw rating, power rating]
    # Motors are sold in nominal steps rounded per unit system: 5 hp is listed as 3.7 kW
    # (3.73 exactly), 7.5 hp as 5.5 kW (5.59), so the same motor differs by up to ~2 %.
    rel_tolerance: 0.02
  - name: speed
    dimension: speed
    canonical_unit: rpm
    synonyms: [speed, rpm, rotational speed]
  - name: body_material
    dimension: none
    material: true
    synonyms: [body, body material, body moc, moc of body, shell material, body bonnet,
               body and bonnet]
  - name: bonnet_type
    dimension: none
    synonyms: [bonnet type, bonnet construction, body bonnet construction]
  - name: disc_material
    dimension: none
    material: true
    synonyms: [disc, disc material, disk, wedge, ball material, closure member]
  - name: seat_material
    dimension: none
    material: true
    synonyms: [seat, seat material, seat ring, seal ring, liner, body liner, seat liner]
  - name: stem_material
    dimension: none
    material: true
    synonyms: [stem, stem material, shaft, shaft material, pump shaft, spindle, hinge pin]
  - name: impeller_material
    dimension: none
    material: true
    synonyms: [impeller, impeller material, impeller moc, moc of impeller]
  - name: casing_material
    dimension: none
    material: true
    synonyms: [casing, casing material, casing moc, moc of casing, pump casing, delivery casing,
               volute casing]
  - name: motor_body_material  # "Motor Body" is not the pump's body
    dimension: none
    material: true
    synonyms: [motor body]
  - name: trim_material
    dimension: none
    material: true
    synonyms: [trim, trim material]
  - name: packing_material
    dimension: none
    material: true
    synonyms: [packing, gland packing, stem seal]
  # Control-valve accessories (actuator, positioner, air filter regulator): their connections and
  # feedback are other components, never the valve's own end connection (like for like). A label
  # naming the accessory first resolves here: the candidate starting first names the most.
  - name: accessory_connection
    dimension: none
    synonyms: [actuator pneumatic connection, actuator connection, actuator air connection,
               air filter regulator connection, positioner pneumatic electric connection,
               positioner connection, air connection, pneumatic connection]
  - name: positioner_feedback
    dimension: none
    synonyms: [positioner position feedback, position feedback, position transmitter]
  - name: positioner_type
    dimension: none
    synonyms: [positioner type, type of positioner]
  - name: end_connection
    dimension: none
    synonyms: [end connection, ends, end type, connection]
    values: [flanged, butt_weld, socket_weld, threaded, wafer, lug]
  - name: operation
    dimension: none
    synonyms: [operation, operator, actuation, operated]
    values: [lever, gear, handwheel, electric_actuator, pneumatic_actuator]
  - name: design_standard
    critical: true
    dimension: none
    synonyms: [design standard, design code, manufacturing standard, design, design mfg std,
               governing specification, product standard]
    # A standard that can only be this attribute: printed anywhere in the item's own product
    # text ("conforms to API 594"), it states the attribute without a label.
    codes: [API 594, API 600, API 602, API 603, API 608, API 609, API 6D, BS 1414, BS 1868,
            BS 1873, BS 5150, BS 5152, BS 5153, BS 5154, BS 5155, BS 5351, BS 5352, ISO 10434,
            ISO 14313, ISO 15761, ISO 17292, EN 593, EN 1171, EN 1984, EN 12334, IS 778,
            IS 780, IS 5312, IS 13095, IS 14846, ASME B16.34, AWWA C504]
  - name: test_standard
    dimension: none
    synonyms: [testing standard, test standard, inspection and testing]
    codes: [API 598, ISO 5208, BS 6755, EN 12266]
  - name: flange_drilling
    dimension: none
    synonyms: [flange drilling, flange drilling standard, drilling standard]
  - name: face_to_face_standard
    dimension: none
    synonyms: [face to face, face-to-face, f to f]

# Also what makes a vendor value a material: a material attribute fails only on a value naming
# one of these, an equivalents term or a code ("CODE" or a lone "S" column mark decides nothing).
material_names: [cast iron, ductile iron, sg iron, cast steel, carbon steel, stainless steel,
                 alloy steel, mild steel, ss, ci, cs, ms, bronze, gun metal, gunmetal, brass,
                 noryl, aluminium, aluminum, copper, nickel, monel, inconel, hastelloy, titanium,
                 duplex, stellite, chrome, chromium, cr steel, epdm, nbr, nitrile, buna, viton, fkm, ptfe,
                 rptfe, teflon, neoprene, hypalon, graphite, rubber, silicone, peek, nylon,
                 polypropylene, pvc, upvc, cpvc, hdpe]

codes:
  # Stainless grades written in words, any grade (2xx, 30x-34x, 40x-44x): "Stainless Steel, Gr 316",
  # "stainless steel grade 304L", "316 stainless steel" -> the same code as "SS 316". A number
  # followed by a unit ("stainless steel 250 mm") is a size, not a grade.
  - pattern: '\bstainless\s+steel\s*,?\s*(?:(?:aisi|gr|grade|type)\.?\s*)?-?\s*(2\d\d|3[0-4]\d|4[0-4]\d)(?:\s*(l))?\b(?!\s*(?:mm|cm|m\b|bar|kg|psi|nb|dn|°|deg|"|#))'
    canonical: 'ss\1\2'
  - pattern: '\b(2\d\d|3[0-4]\d|4[0-4]\d)(?:\s*(l))?\s+stainless\s+steel\b'
    canonical: 'ss\1\2'
  # Any other stainless grade with the SS / AISI prefix ("SS 446", "AISI 420", "431 SS"); the
  # named grades below keep their own rules.
  - pattern: '\b(?:ss|aisi)\s*-?\s*(2\d\d|3[0-4]\d|4[0-4]\d)(?:\s*(l))?\b(?!\s*(?:mm|cm|m\b|bar|kg|psi|nb|dn|°|deg|"|#))|\b(2\d\d|3[0-4]\d|4[0-4]\d)(?:\s*(l))?\s*ss\b'
    canonical: 'ss\1\2\3\4'
  # Stainless grades: "SS 316L", "SS-316", "316 SS", "AISI 316"
  - pattern: '\b(?:ss|aisi)\s*-?\s*316\s*l\b|\b316\s*l\s*ss\b'
    canonical: ss316l
  - pattern: '\b(?:ss|aisi)\s*-?\s*316\b|\b316\s*ss\b'
    canonical: ss316
  - pattern: '\b(?:ss|aisi)\s*-?\s*304\s*l\b|\b304\s*l\s*ss\b'
    canonical: ss304l
  - pattern: '\b(?:ss|aisi)\s*-?\s*304\b|\b304\s*ss\b'
    canonical: ss304
  - pattern: '\b(?:ss|aisi)\s*-?\s*410\b|\b410\s*ss\b'
    canonical: ss410
  - pattern: '\b17\s*-?\s*4\s*-?\s*ph\b'
    canonical: 17_4ph
  # ASTM castings and forgings: "ASTM A 216 Gr. WCB", "A216 WCB", "WCB"
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*216\s*(?:gr(?:ade)?\.?\s*)?)?wcb\b'
    canonical: a216_wcb
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*216\s*(?:gr(?:ade)?\.?\s*)?)?wcc\b'
    canonical: a216_wcc
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*217\s*(?:gr(?:ade)?\.?\s*)?)?wc\s*-?\s*6\b'
    canonical: a217_wc6
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*217\s*(?:gr(?:ade)?\.?\s*)?)?wc\s*-?\s*9\b'
    canonical: a217_wc9
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*352\s*(?:gr(?:ade)?\.?\s*)?)?lcb\b'
    canonical: a352_lcb
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*352\s*(?:gr(?:ade)?\.?\s*)?)?lcc\b'
    canonical: a352_lcc
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*351\s*(?:gr(?:ade)?\.?\s*)?)?cf\s*-?\s*8\s*m\b'
    canonical: a351_cf8m
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*351\s*(?:gr(?:ade)?\.?\s*)?)?cf\s*-?\s*8\b'
    canonical: a351_cf8
  - pattern: '\b(?:astm\s*)?a\s*-?\s*105\s*n?\b'
    canonical: a105
  - pattern: '\b(?:astm\s*)?(?:a\s*-?\s*350\s*(?:gr(?:ade)?\.?\s*)?)?lf\s*-?\s*2\b'
    canonical: a350_lf2
  # Ratings and sizes: "PN 16", "Class 150", "150#", "150 lbs", "DN 80", "80 NB"
  - pattern: '\bpn\s*-?\s*(\d+)\b'
    canonical: 'pn\1'
  - pattern: '\b(?:class|cl\.?)\s*-?\s*(\d{3,4})\b'
    canonical: 'class\1'
  - pattern: '\b(\d{3,4})\s*(?:#|lbs?\b)'
    canonical: 'class\1'
  - pattern: '\bdn\s*-?\s*(\d+)\b'
    canonical: 'dn\1'
  - pattern: '\bnb\s*-?\s*(\d+)\b|\b(\d+)\s*nb\b'
    canonical: 'dn\1\2'
  # Standards: "API 600", "API-6D", "BS 5351", "IS 14846"
  - pattern: '\bapi\s*-?\s*(\d+[a-z]?)\b'
    canonical: 'api\1'
  # "BS EN 593" is EN 593 adopted by BSI: same standard as "EN 593" / "EN593" (before the BS rule)
  - pattern: '\b(?:bs\s*-?\s*)?en\s*-?\s*(\d{3,5})\b'
    canonical: 'en\1'
  - pattern: '\bbs\s*-?\s*(\d{3,5})\b'
    canonical: 'bs\1'
  - pattern: '\bis\s*[:-]?\s*(\d{3,5})\b'
    canonical: 'is\1'
  - pattern: '\basme\s*-?\s*b\s*-?\s*(\d+)\.(\d+)\b'
    canonical: 'asme_b\1_\2'

abbreviations:
  nrv: check valve
  bfv: butterfly valve
  tobv: triple offset butterfly valve
  ci: cast iron
  sg iron: ductile iron
  di: ductile iron
  cs: carbon steel
  ms: mild steel
  moc: material of construction
  nb: nominal size
  dn: nominal size
  nps: nominal size
  ff: flat face
  rf: raised face
  rtj: ring type joint
  bw: butt weld
  sw: socket weld
  ptfe: polytetrafluoroethylene
  rptfe: reinforced ptfe

equivalents:
  # Grade codes are written joined ("IS210"): a bare number would match any "210 mm".
  # Only grades that are unambiguously this material family belong here.
  - name: cast_iron
    terms: [cast iron, grey cast iron, gray cast iron, grey iron, ci, A126, A48, IS210, EN1561,
            GG25, FG260]
  - name: stainless_steel
    terms: [stainless steel, ss]
  - name: ductile_iron
    terms: [ductile iron, sg iron, sgi, spheroidal graphite iron, di, A536, A395, IS1865,
            EN1563, GGG40, GGG50]
  # Seat and disc facings. L&T trim tables print "HF" (hard-faced) for a Stellite facing; the
  # alloy grade is not printed, so it meets "Stellite" only as partial (grade not printed).
  - name: hard_facing
    terms: [stellite, stellited, hard facing, hard faced, hardfaced, hf]

