  mm: mm
  millimeter: mm
  millimeters: mm
  millimetre: mm
  millimetres: mm
  cm: cm
  centimeter: cm
  m: m
  meter: m
  meters: m
  metre: m
  metres: m
  in: inch
  inch: inch
  inches: inch
  "''": inch
  '"': inch
  bar: bar
  barg: bar
  mbar: mbar
  psi: psi
  psig: psi
  mpa: MPa
  kpa: kPa
  kg/cm2: kgf/cm**2
  kg/cm²: kgf/cm**2
  kgf/cm2: kgf/cm**2
  kgf/cm²: kgf/cm**2
  ksc: kgf/cm**2
  °c: degC
  deg c: degC
  degc: degC
  c: degC
  °f: degF
