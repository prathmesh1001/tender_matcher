# Ontology for process instruments (GeM tenders vs vendor documents). Same format as
# valves_pumps.yaml; see that file for what each section means.
#
# No manufacturer catalogue is registered for these types yet: with DISCOVERY_ENABLED their
# evidence can come from GeM Marketplace listings (config/gem_marketplace.yaml), which are
# seller-declared and always go to review.

category: instruments
version: 1

product_types:
  # "Thermocouple with Thermowell" is one thermocouple assembly: a thermowell is not a type
  # here, so such a title names exactly one type.
  - name: thermocouple
    synonyms: [thermocouple, thermo couple, thermocouples]
    sub_types:
      - name: mineral_insulated
        synonyms: [mineral insulated, mi thermocouple]

other_products: [rtd, resistance temperature detector, pressure gauge, temperature gauge,
  pressure transmitter, temperature transmitter, thermowell]

label_generic_words: [moc, material, parameter, type, spec, specification, description, detail,
                      range, of, to, and, for, at, the, max, maximum, min, minimum]

attributes:
  - name: thermocouple_type
    critical: true
    dimension: none
    synonyms: [thermocouple type, type of thermocouple, sensor type, element type, calibration,
               thermocouple]
  - name: sheath_material
    dimension: none
    material: true
    synonyms: [sheath material, sheath moc, sheath]
  - name: thermowell_material
    dimension: none
    material: true
    synonyms: [thermowell material, thermowell moc, thermowell]
  - name: sheath_diameter
    dimension: length
    canonical_unit: mm
    synonyms: [sheath diameter, sheath od, diameter of sheath, outer diameter]
  - name: insertion_length
    dimension: length
    canonical_unit: mm
    synonyms: [insertion length, immersion length, length of thermocouple, length]
  - name: max_temperature
    dimension: temperature
    canonical_unit: degC
    synonyms: [temperature range, max temperature, maximum temperature, operating temperature,
               measuring range, temperature]
    limit: max
    physical_min: -273.15
  - name: process_connection
    dimension: none
    synonyms: [process connection, mounting, connection type, connection]
  - name: pressure_class
    dimension: none
    synonyms: [class, flange rating, pressure class, rating]

material_names: [stainless steel, ss, inconel, incoloy, carbon steel, alloy steel, hastelloy,
                 monel, ceramic, alumina, brass]

# No codes or equivalents here: every ontology's codes go into one shared search vocabulary,
# and valves_pumps.yaml already folds SS316 / A182 spellings.

units:
  mm: mm
  cm: cm
  m: m
  in: inch
  inch: inch
  inches: inch
  "''": inch
  '"': inch
  °c: degC
  deg c: degC
  degc: degC
  c: degC
