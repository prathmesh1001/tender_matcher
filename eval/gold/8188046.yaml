# Hand labels for tender GEM/2026/B/8188046, drafted by Claude, checked by the user 2026-11-19.
#
# Drafted by Claude on 2026-11-13 from the bid's GeM specification tables (p4 item 1, p4-5 item 2)
# and from the catalogue page text, never from the system's output. Checked by the user on 2026-11-19
# (every choice below kept as drafted).
#
# Items: 1 = 70 pieces DN 100, 2 = 25 pieces DN 150. Both: Conformity IS 13095; Application
# "Tight Shut Off"; End connection "Flangeless Wafer Valve"; Face to Face "Wafer Short (PN 2.5)
# Class 125/150"; Nominal Pressure 1.6 MPa (PN 16). Item 1 also has a test-report row (vendor
# document, not labelled); item 2 has none.
#
# One product per manufacturer (B10):
#   KSB:       BOAX-B centred disc valve (the only product of the booklet).
#   Kirloskar: the resilient-seated centric WAFER / lugged wafer valve (p11-12), the product made
#              as a wafer at DN 100/150. (The system's current evidence "Optional for Valves as per
#              IS 13095" belongs to the double-eccentric flanged valve, another product.)
#   Delval:    Series 50 wafer (bulletin 098).
#
# Choices the user confirmed on 2026-11-19:
#   - KSB end connection: the wafer body is only DN 650-1000; DN 100/150 come as semi-lug (fits
#     between flanges, no body flanges) -> partial.
#   - Face to face "Wafer Short": ISO 5752 / EN 558-1 series 20 is the short wafer pattern -> partial
#     for KSB, since the tender's "(PN 2.5) Class 125/150" qualifier is not stated.
#   - Delval PN 16: rated 175 psi (12.0 barg) for DN 50-300, below 16 bar -> missing.
#
# Status: full_match | partial_match | missing_capability | unsupported.
