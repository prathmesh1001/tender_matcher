server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, asked again every 10 s: a recreated backend container gets a new address,
    # and an address resolved once at nginx start then fails ("Host is unreachable", 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;  # a variable makes nginx resolve per request
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        # Above TENDER_UPLOAD_MAX_MB, so the API reports a too-large upload, not nginx.
        client_max_body_size 60m;
    }

    # React Router owns every other path, e.g. /reports/<run id> opened directly.
    location / {
        try_files $uri /index.html;
    }
}
